buildscript {
    dependencies {
        classpath 'edu.sc.seis.launch4j:launch4j:4.0.0'
    }
}

plugins {
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
    id 'io.github.ben-manes.versions' version '0.67.0'
}

configurations.all {
    resolutionStrategy {
        cacheChangingModulesFor 0, 'seconds'
    }
}

repositories {
    mavenCentral()
    maven {
        url = 'https://oss.sonatype.org/content/repositories/snapshots/'
        content {
            includeGroup 'org.quelea'
        }
        mavenContent {
            snapshotsOnly()
        }
    }
}

// Launch4j 4.0.0 uses the deprecated Configuration.setVisible API when applied.
// Keep its task implementation but configure it without that obsolete call.
apply plugin: QueleaLaunch4jPlugin

javafx {
    version = "25.0.5.1"
    modules = [ 'javafx.base', 'javafx.controls', 'javafx.fxml', 'javafx.graphics', 'javafx.media', 'javafx.swing', 'javafx.web' ]
}

ext {
    versionsuffix = System.properties["versionsuffix"]!=null ? System.properties["versionsuffix"] : project.queleaversion

    CPInstallerName="quelea-" + versionsuffix + "-crossplatform-install.jar"
    WindowsInstallerName="quelea-" + versionsuffix + "-x86-windows-install.exe"
    WindowsInstaller64Name="quelea-" + versionsuffix + "-x64-windows-install.exe"
    MacInstallerName="quelea-" + versionsuffix + "-mac.zip"
    JavaAppName="quelea-" + versionsuffix + "-java-app.tar.gz"

    CPInstaller ="dist/standalone/" + CPInstallerName
    WindowsInstaller="dist/standalone/" + ext.WindowsInstallerName
    WindowsInstaller64="dist/standalone/" + ext.WindowsInstaller64Name
}

tasks.withType(JavaCompile) {
    configure(options) {
        options.compilerArgs << '-Xlint:deprecation' << '-Xlint:unchecked'
    }
}

tasks.register('removeDist', Delete) {
    delete "dist"
    delete "out-mac"
    delete "bundlejre"
}

compileJava   {
    sourceCompatibility = '25'
    targetCompatibility = '25'
}

clean.finalizedBy(removeDist)
compileJava.finalizedBy(dependencyUpdates)

// Keep dependency updates in their normal report rather than treating them as build problems.
tasks.named('dependencyUpdates') {
    outputFormatter = 'plain'
}

[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'
ext.mainClass = 'org.quelea.windows.main.MainStub'
// JavaFX's graphics and web modules use JNI; leave classpath code unchanged.
ext.nativeAccessJvmArg = '--enable-native-access=javafx.graphics,javafx.web'

application {
    mainClass = 'org.quelea.windows.main.MainStub'
    applicationDefaultJvmArgs = [nativeAccessJvmArg, "--add-opens=java.base/java.nio=ALL-UNNAMED", "-Dglass.accessible.force=false", "--add-exports=javafx.graphics/com.sun.javafx.tk.quantum=ALL-UNNAMED", "--add-exports=javafx.graphics/com.sun.javafx.css=ALL-UNNAMED", "--add-exports=javafx.base/com.sun.javafx.runtime=ALL-UNNAMED", "--add-exports=javafx.base/com.sun.javafx.event=ALL-UNNAMED", "--add-opens=java.base/java.lang=ALL-UNNAMED", "--add-opens=javafx.controls/javafx.scene.control=ALL-UNNAMED"]
}

tasks.register('createQueleaExe64', edu.sc.seis.launch4j.tasks.Launch4jLibraryTask) { //Launch4j
    mainClassName = 'org.quelea.windows.main.MainStub'
    mutexName = "queleamutex"
    supportUrl = "https://quelea.discourse.group/"
    icon = "../../icons/logo.ico"
    copyright = "GPLv3"
    bundledJrePath = "winjre64"
    jvmOptions = [nativeAccessJvmArg, "-Dfile.encoding=UTF-8", "-Dprism.dirtyopts=false", "--add-opens java.base/java.nio=ALL-UNNAMED", "-Dglass.accessible.force=false", "--add-exports=javafx.graphics/com.sun.javafx.tk.quantum=ALL-UNNAMED", "--add-exports=javafx.graphics/com.sun.javafx.css=ALL-UNNAMED", "--add-exports=javafx.base/com.sun.javafx.runtime=ALL-UNNAMED", "--add-exports=javafx.base/com.sun.javafx.event=ALL-UNNAMED", "--add-opens java.base/java.lang=ALL-UNNAMED", "--add-opens javafx.controls/javafx.scene.control=ALL-UNNAMED"]
    outfile = "Quelea64.exe"
    jreMinVersion = "1.5" //Hack to bypass launch4j
}

tasks.register('downloadGStreamer') {
    def installer = layout.buildDirectory.file('downloads/gstreamer-1.0-msvc-x86_64-1.26.11.msi')
    outputs.file(installer)
    doLast {
        def verifyChecksum = { File file ->
            def digest = MessageDigest.getInstance('SHA-256')
            file.withInputStream { input ->
                byte[] buffer = new byte[64 * 1024]
                int count
                while ((count = input.read(buffer)) != -1) {
                    digest.update(buffer, 0, count)
                }
            }
            if (digest.digest().encodeHex().toString() != '31cbc21fa0950b5c1e79c80959b2799805cb05a7a35953a13a9f790776137605') {
                throw new GradleException("GStreamer installer checksum does not match: ${file}")
            }
        }
        def destination = installer.get().asFile
        if (destination.isFile()) {
            verifyChecksum(destination)
            return
        }
        destination.parentFile.mkdirs()
        def temporary = new File(destination.parentFile, destination.name + '.part')
        new URI('https://gstreamer.freedesktop.org/data/pkg/windows/1.26.11/msvc/gstreamer-1.0-msvc-x86_64-1.26.11.msi').toURL().withInputStream { input ->
            temporary.withOutputStream { output -> output << input }
        }
        verifyChecksum(temporary)
        Files.move(temporary.toPath(), destination.toPath(), StandardCopyOption.REPLACE_EXISTING)
    }
}

tasks.register('downloadJres') {
    def mf = file('macjre.zip')
    if (!mf.exists()) {
        new URL('https://cdn.azul.com/zulu/bin/zulu25.38.109-ca-fx-jre25.0.5.0.3-macosx_x64.zip').withInputStream { i -> mf.withOutputStream { it << i } }
    }

    def wf = file('winjre64.zip')
    if (!wf.exists()) {
        new URL('https://cdn.azul.com/zulu/bin/zulu25.38.109-ca-fx-jre25.0.5.0.3-win_x64.zip').withInputStream { i -> wf.withOutputStream { it << i } }
    }

    doLast {
        def bundleDir = file("bundlejre").toPath()
        Files.createDirectories(bundleDir)
        Files.move(mf.toPath(), bundleDir.resolve(mf.name), StandardCopyOption.REPLACE_EXISTING)
        Files.move(wf.toPath(), bundleDir.resolve(wf.name), StandardCopyOption.REPLACE_EXISTING)
    }
}

tasks.register('copyToDist') {
    doLast {
        copy { from configurations.runtimeClasspath into project.distdir + "/libjfx" include "javafx*" }
        // all JavaFX libraries
        copy { from configurations.runtimeClasspath into project.distdir + "/lib" exclude "javafx*" }
        // all libraries except JavaFX libraries
        copy { from "themes" into project.distdir + "/themes" }
        copy { from "icons" into project.distdir + "/icons" }
        copy { from "bibles" into project.distdir + "/bibles" }
        copy { from "server" into project.distdir + "/server" }
        copy { from "vid" into project.distdir + "/vid" }
        copy { from "vbs" into project.distdir + "/vbs" }
        copy { from "licenses" into project.distdir + "/licenses" }
        copy { from "languages" into project.distdir + "/languages" }
        copy { from "dictionaries" into project.distdir + "/dictionaries" }
        copy { from "img" into project.distdir + "/img" }
        copy { from "timer" into project.distdir + "/timer" }
        copy { from "src" into project.distdir + "/src" }
        def wf = new File('bundlejre/winjre64.zip')
        if (wf.exists()) {
            copy { from zipTree("bundlejre/winjre64.zip") into project.distdir }
            file("dist/zulu25.38.109-ca-fx-jre25.0.5.0.3-win_x64").renameTo(file("dist/winjre64"))
        }
        copy { from file("build/libs/Quelea.jar") into file(project.distdir) }
        copy { from file("README.TXT") into file(project.distdir) }
        copy { from file("quelea.properties") into file(project.distdir) }
        copy { from file("scheduleformat.xsl") into file(project.distdir) }
        copy { from file("songformat.xsl") into file(project.distdir) }
        copy { from file("fopcfg.xml") into file(project.distdir) }
        copy { from file("Quelea.bat") into file(project.distdir) }
        copy { from file("quelea.iss") into file(project.distdir) }
        copy { from file("quelea64.iss") into file(project.distdir) }
        copy { from file("build-install.bat") into file(project.distdir) }
        copy { from file("build-install.sh") into file(project.distdir) }
        copy { from file("licenses/gplv3.txt") into file(project.distdir) rename { String filename -> return "LICENSE.txt" } }
        copy { from file("launch.sh") into file(project.distdir) }
        copy { from file("licenses/copyright") into file(project.distdir + "/queleadoc") }
    }
}

tasks.register('grabNative') {
    doLast {
        copy {
            from file(project.file('osx/libAVPlayerJava.jnilib'))
            into project.file(project.distdir + '/lib/')
        }
    }
}
copyToDist.finalizedBy(grabNative)

// Run IzPack's compiler directly; its Gradle plugin depends on deprecated
// configuration and Ant APIs.
configurations.create('izpack') {
    canBeConsumed = false
    canBeResolved = true
    transitive = true
    description = 'The IzPack standalone compiler libraries to be used for this project.'
}

tasks.register('izPackCreateInstaller', JavaExec) {
    group = 'installation'
    description = 'Creates an IzPack-based installer'
    classpath = configurations.izpack
    mainClass = 'com.izforge.izpack.compiler.bootstrap.CompilerLauncher'
    def installerConfig = file("izpack/config.xml")
    def installerBase = file("dist")
    def installerOutput = file(CPInstaller)
    inputs.file(installerConfig)
    inputs.dir(installerBase)
    outputs.file(installerOutput)
    args installerConfig.absolutePath, '-b', installerBase.absolutePath,
            '-o', installerOutput.absolutePath, '-k', 'standard', '-c', 'default', '-l', '-1'
}

tasks.register('innosetup', Exec) {
    dependsOn tasks.named('downloadGStreamer')
    doFirst {
        workingDir = project.file('.')
        if (System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('windows')) {
            commandLine = ['cmd', '/C', 'build-install.bat', project.queleaversion]
        } else {
            commandLine = ['sh', './build-install.sh', project.queleaversion]
        }
    }

    doLast {
        copy { from file("Output/setup.exe") into file(project.distdir + "/standalone") rename { String filename -> return WindowsInstallerName } }
        copy { from file("Output/setup64.exe") into file(project.distdir + "/standalone") rename { String filename -> return WindowsInstaller64Name } }
        delete(file("Output"))
    }
}

tasks.register('labelcheck', JavaExec) {
    mainClass = 'org.quelea.services.languages.LabelChecker'
    classpath = sourceSets.main.runtimeClasspath
}

// Packr bundles Log4j's Java 9+ classes but omits the manifest attribute
// needed to load them. Prepare a copy without changing the checked-in jar.
tasks.register('packrRuntimeJar', Jar) {
    archiveFileName = 'packr-runtime.jar'
    destinationDirectory = layout.buildDirectory.dir('packr')
    from(zipTree('packr.jar')) {
        exclude 'META-INF/MANIFEST.MF'
    }
    manifest.attributes('Multi-Release': 'true')
}

tasks.register('runPackr', JavaExec) {
    classpath = files(tasks.named('packrRuntimeJar'))
    mainClass = "com.badlogicgames.packr.Packr"
    args = ["packr.json"]

    doLast {
        // macOS shows this text when Quelea first asks to control PowerPoint
        // (Automation permission); without it the prompt has no explanation.
        def plist = file("out-mac/Quelea.app/Contents/Info.plist")
        if (plist.exists() && !plist.text.contains("NSAppleEventsUsageDescription")) {
            def text = plist.text
            int end = text.lastIndexOf("</dict>")
            plist.text = text.substring(0, end) +
                    "\t<key>NSAppleEventsUsageDescription</key>\n" +
                    "\t<string>Quelea controls Microsoft PowerPoint to run presentations in its slide show.</string>\n" +
                    text.substring(end)
        }
        // Packr strips one leading dash from each vmarg and adds one back only
        // if none is left, so "--add-opens=..." reaches the launcher as
        // "-add-opens=...", which the JVM ignores. Restore the double dash.
        def launcherConfig = file("out-mac/Quelea.app/Contents/Resources/Quelea.json")
        if (launcherConfig.exists()) {
            launcherConfig.text = launcherConfig.text.replaceAll(/"-add-(opens|exports)=/, '"--add-$1=')
        }
    }
}

tasks.register('zipMacPackr', Zip) {
    archiveFileName = MacInstallerName
    destinationDirectory = file("dist/standalone")
    // Since Gradle 9 archives get normalised permissions (rw-r--r--) by
    // default, which drops the executable bit from the app's launcher and
    // its JRE: macOS then refuses to open Quelea.app.
    useFileSystemPermissions()

    from "out-mac"

    doLast {
        delete(file("out-mac"))
    }
}

runPackr.finalizedBy(zipMacPackr);

tasks.register('dist', GradleBuild) {
    tasks = ['labelcheck', 'downloadJres', 'downloadGStreamer', 'createQueleaExe64', 'copyToDist', 'tar', 'runPackr', 'izpack', 'innosetup', 'releaseSummary']
}

