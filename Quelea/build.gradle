import java.nio.file.Files
import java.nio.file.StandardCopyOption
import java.security.MessageDigest

buildscript {
    dependencies {
        classpath 'edu.sc.seis.launch4j:launch4j:4.0.0'
        classpath 'com.bmuschko:gradle-izpack-plugin:3.2'
    }
}

plugins {
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
    id 'edu.sc.seis.launch4j' version '4.0.0'
    id 'io.github.ben-manes.versions' version '0.67.0'
    id 'com.bmuschko.izpack' version '3.2'
}

configurations.all {
    resolutionStrategy {
        cacheChangingModulesFor 0, 'seconds'
    }
}

repositories {
    mavenCentral()
    maven {
        url 'https://oss.sonatype.org/content/repositories/snapshots/'
        content {
            includeGroup 'org.quelea'
        }
        mavenContent {
            snapshotsOnly()
        }
    }
}

javafx {
    version = "27.0.1.1"
    modules = [ 'javafx.base', 'javafx.controls', 'javafx.fxml', 'javafx.graphics', 'javafx.media', 'javafx.swing', 'javafx.web' ]
}

ext {
    versionsuffix = System.properties["versionsuffix"]!=null ? System.properties["versionsuffix"] : project.queleaversion

    CPInstallerName="quelea-" + versionsuffix + "-crossplatform-install.jar"
    WindowsInstallerName="quelea-" + versionsuffix + "-x86-windows-install.exe"
    WindowsInstaller64Name="quelea-" + versionsuffix + "-x64-windows-install.exe"
    MacInstallerName="quelea-" + versionsuffix + "-mac.zip"
    JavaAppName="quelea-" + versionsuffix + "-java-app.tar.gz"

    CPInstaller ="dist/standalone/" + CPInstallerName
    WindowsInstaller="dist/standalone/" + ext.WindowsInstallerName
    WindowsInstaller64="dist/standalone/" + ext.WindowsInstaller64Name
}

tasks.withType(JavaCompile) {
    configure(options) {
        options.compilerArgs << '-Xlint:deprecation' << '-Xlint:unchecked'
    }
}

tasks.register('removeDist', Delete) {
    delete "dist"
    delete "out-mac"
    delete "bundlejre"
}

compileJava   {
    sourceCompatibility = '25'
    targetCompatibility = '25'
}

clean.finalizedBy(removeDist)
compileJava.finalizedBy(dependencyUpdates)

[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'
ext.mainClass = 'org.quelea.windows.main.MainStub'

application {
    mainClass = 'org.quelea.windows.main.MainStub'
    applicationDefaultJvmArgs = ["--add-opens=java.base/java.nio=ALL-UNNAMED", "-Dglass.accessible.force=false", "--add-exports=javafx.graphics/com.sun.javafx.tk.quantum=ALL-UNNAMED", "--add-exports=javafx.graphics/com.sun.javafx.css=ALL-UNNAMED", "--add-exports=javafx.base/com.sun.javafx.runtime=ALL-UNNAMED", "--add-exports=javafx.base/com.sun.javafx.event=ALL-UNNAMED", "--add-opens=java.base/java.lang=ALL-UNNAMED", "--add-opens=javafx.controls/javafx.scene.control=ALL-UNNAMED"]
}

tasks.register('createQueleaExe64', edu.sc.seis.launch4j.tasks.Launch4jLibraryTask) { //Launch4j
    mainClassName = 'org.quelea.windows.main.MainStub'
    mutexName = "queleamutex"
    supportUrl = "https://quelea.discourse.group/"
    icon = "../../icons/logo.ico"
    copyright = "GPLv3"
    bundledJrePath = "winjre64"
    jvmOptions = ["-Dfile.encoding=UTF-8", "-Dprism.dirtyopts=false", "--add-opens java.base/java.nio=ALL-UNNAMED", "-Dglass.accessible.force=false", "--add-exports=javafx.graphics/com.sun.javafx.tk.quantum=ALL-UNNAMED", "--add-exports=javafx.graphics/com.sun.javafx.css=ALL-UNNAMED", "--add-exports=javafx.base/com.sun.javafx.runtime=ALL-UNNAMED", "--add-exports=javafx.base/com.sun.javafx.event=ALL-UNNAMED", "--add-opens java.base/java.lang=ALL-UNNAMED", "--add-opens javafx.controls/javafx.scene.control=ALL-UNNAMED"]
    outfile = "Quelea64.exe"
    jreMinVersion = "1.5" //Hack to bypass launch4j
}

tasks.register('downloadGStreamer') {
    def f = new File('gs.msi')
    if (!f.exists()) {
        new URL('https://gstreamer.freedesktop.org/data/pkg/windows/1.26.11/msvc/gstreamer-1.0-msvc-x86_64-1.26.11.msi').withInputStream { i -> f.withOutputStream { it << i } }
    }
}

// BellSoft's 27.0.1.1+5 full JRE reports JavaFX 27.0.1+1, but its
// release notes include JDK-8392009, the fix in OpenJFX 27.0.1.1:
// https://docs.bell-sw.com/liberica-jdk/27.0.1.1b5/general/release-notes/
def runtimeCacheDir = layout.buildDirectory.dir('runtime-bundles')
def runtimeBundles = [
    [name: 'bellsoft-jre27.0.1.1+5-macos-amd64-full.zip', sha256: 'c6b89c3274af6685c0f3899e5804423d894a3ec35dd44096b24b71efa7d6c854'],
    [name: 'bellsoft-jre27.0.1.1+5-windows-amd64-full.zip', sha256: '831f72c64a4d85fe784fa9a0936275ce9dd0ce5155c6cec5312c100a6c7f5973']
]
def windowsRuntimeArchive = runtimeCacheDir.map { it.file(runtimeBundles[1].name) }

tasks.register('downloadJres') {
    doLast {
        def cacheDir = runtimeCacheDir.get().asFile
        cacheDir.mkdirs()
        runtimeBundles.each { bundle ->
            def archive = new File(cacheDir, bundle.name)
            if (!archive.exists()) {
                def partial = new File(cacheDir, bundle.name + '.part')
                new URL("https://download.bell-sw.com/java/27.0.1.1+5/${bundle.name}").withInputStream { input ->
                    partial.withOutputStream { output -> output << input }
                }
                Files.move(partial.toPath(), archive.toPath(), StandardCopyOption.REPLACE_EXISTING)
            }
            def digest = MessageDigest.getInstance('SHA-256')
            archive.withInputStream { input ->
                byte[] buffer = new byte[65536]
                for (int count; (count = input.read(buffer)) != -1;) {
                    digest.update(buffer, 0, count)
                }
            }
            def actualHash = digest.digest().collect { String.format('%02x', it & 0xff) }.join()
            if (actualHash != bundle.sha256) {
                throw new GradleException("Runtime archive checksum mismatch: ${archive}. Remove or replace it before retrying.")
            }
        }
    }
}

tasks.register('copyToDist') {
    dependsOn tasks.named('downloadJres')
    doLast {
        def runtimeDir = file("${project.distdir}/winjre64")
        if (runtimeDir.exists()) {
            def release = new File(runtimeDir, 'release')
            def fxVersion = new File(runtimeDir, 'lib/javafx.properties')
            if (!release.isFile() || !release.getText('UTF-8').contains('JAVA_VERSION="27.0.1.1"') ||
                    !fxVersion.isFile() || !fxVersion.getText('UTF-8').contains('javafx.version=27.0.1+1')) {
                throw new GradleException("Existing ${runtimeDir} does not match the bundled runtime. Move it aside before building the distribution.")
            }
        }
        copy { from configurations.runtimeClasspath into project.distdir + "/libjfx" include "javafx*" }
        // all JavaFX libraries
        copy { from configurations.runtimeClasspath into project.distdir + "/lib" exclude "javafx*" }
        // all libraries except JavaFX libraries
        copy { from "themes" into project.distdir + "/themes" }
        copy { from "icons" into project.distdir + "/icons" }
        copy { from "bibles" into project.distdir + "/bibles" }
        copy { from "server" into project.distdir + "/server" }
        copy { from "vid" into project.distdir + "/vid" }
        copy { from "vbs" into project.distdir + "/vbs" }
        copy { from "licenses" into project.distdir + "/licenses" }
        copy { from "languages" into project.distdir + "/languages" }
        copy { from "dictionaries" into project.distdir + "/dictionaries" }
        copy { from "img" into project.distdir + "/img" }
        copy { from "timer" into project.distdir + "/timer" }
        copy { from "src" into project.distdir + "/src" }
        copy {
            from(zipTree(windowsRuntimeArchive.get().asFile)) {
                eachFile { path = path.substring(path.indexOf('/') + 1) }
                includeEmptyDirs = false
            }
            into runtimeDir
        }
        copy { from file("build/libs/Quelea.jar") into file(project.distdir) }
        copy { from file("README.TXT") into file(project.distdir) }
        copy { from file("quelea.properties") into file(project.distdir) }
        copy { from file("scheduleformat.xsl") into file(project.distdir) }
        copy { from file("songformat.xsl") into file(project.distdir) }
        copy { from file("fopcfg.xml") into file(project.distdir) }
        copy { from file("Quelea.bat") into file(project.distdir) }
        copy { from file("quelea.iss") into file(project.distdir) }
        copy { from file("quelea64.iss") into file(project.distdir) }
        copy { from file("build-install.bat") into file(project.distdir) }
        copy { from file("build-install.sh") into file(project.distdir) }
        copy { from file("licenses/gplv3.txt") into file(project.distdir) rename { String filename -> return "LICENSE.txt" } }
        copy { from file("launch.sh") into file(project.distdir) }
        copy { from file("licenses/copyright") into file(project.distdir + "/queleadoc") }
    }
}

tasks.register('grabNative') {
    onlyIf { tasks.named('copyToDist').get().state.failure == null }
    doLast {
        copy {
            from file(project.file('osx/libAVPlayerJava.jnilib'))
            into project.file(project.distdir + '/lib/')
        }
    }
}
copyToDist.finalizedBy(grabNative)

izPackCreateInstaller {
    installFile = file("izpack/config.xml")
    outputFile = file(CPInstaller)
    baseDir = file("dist")
}

tasks.register('innosetup', Exec) {
    doFirst {
        workingDir = project.file('.')
        if (System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('windows')) {
            commandLine = ['cmd', '/C', 'build-install.bat', project.queleaversion]
        } else {
            commandLine = ['sh', './build-install.sh', project.queleaversion]
        }
    }

    doLast {
        copy { from file("Output/setup.exe") into file(project.distdir + "/standalone") rename { String filename -> return WindowsInstallerName } }
        copy { from file("Output/setup64.exe") into file(project.distdir + "/standalone") rename { String filename -> return WindowsInstaller64Name } }
        delete(file("Output"))
    }
}

tasks.register('labelcheck', JavaExec) {
    mainClass = 'org.quelea.services.languages.LabelChecker'
    classpath = sourceSets.main.runtimeClasspath
}

tasks.register('runPackr', JavaExec) {
    dependsOn tasks.named('downloadJres')
    classpath = files('packr.jar')
    mainClass = "com.badlogicgames.packr.Packr"
    args = ["packr.json"]
}

tasks.register('zipMacPackr', Zip) {
    archiveFileName = MacInstallerName
    destinationDirectory = file("dist/standalone")

    from "out-mac"

    doLast {
        delete(file("out-mac"))
    }
}

runPackr.finalizedBy(zipMacPackr);

tasks.register('dist', GradleBuild) {
    tasks = ['labelcheck', 'downloadJres', 'downloadGStreamer', 'createQueleaExe64', 'copyToDist', 'tar', 'runPackr', 'izpack', 'innosetup', 'releaseSummary']
}

dependencies {
    izpack 'org.codehaus.izpack:izpack-ant:5.2.7'

    implementation 'com.googlecode.paradoxdriver:paradoxdriver:1.6.3'
    implementation 'com.github.berry120.jopenlyrics:jopenlyrics:2.0'
    implementation group: 'org.hsqldb', name: 'hsqldb', version: '2.7.4'
    implementation group: 'org.apache.poi', name: 'poi-scratchpad', version: '6.0.0'
    implementation group: 'org.apache.poi', name: 'poi-ooxml', version: '6.0.0'
    implementation group: 'org.apache.poi', name: 'poi', version: '6.0.0'
    implementation group: 'org.xerial', name: 'sqlite-jdbc', version: '3.54.1.0'
    implementation group: 'org.apache.avalon.framework', name: 'avalon-framework-api', version: '4.3.1'
    implementation group: 'org.apache.avalon.framework', name: 'avalon-framework-impl', version: '4.3.1'

    implementation 'net.java.dev.jna:jna:5.19.1'
    implementation 'net.java.dev.jna:jna-platform:5.19.1'
    implementation 'org.freedesktop.gstreamer:gst1-java-core:1.4.0'
    implementation 'org.freedesktop.gstreamer:gst1-java-fx:0.9.0'

    implementation group: 'com.googlecode.json-simple', name: 'json-simple', version: '1.1.1'
    implementation group: 'com.google.code.gson', name: 'gson', version: '2.15.0'
    implementation group: 'com.healthmarketscience.jackcess', name: 'jackcess', version: '5.0.4'
    implementation group: 'org.apache.lucene', name: 'lucene-core', version: '8.11.4'
    implementation group: 'org.apache.lucene', name: 'lucene-queryparser', version: '8.11.4'
    implementation group: 'org.apache.lucene', name: 'lucene-analyzers-common', version: '8.11.4'
    implementation group: 'org.apache.pdfbox', name: 'pdfbox', version: '3.0.8'
    implementation group: 'org.apache.httpcomponents', name: 'httpclient', version: '4.5.14'
    implementation group: 'org.apache.httpcomponents', name: 'httpmime', version: '4.5.14'
    implementation group: 'org.fxmisc.richtext', name: 'richtextfx', version: '0.11.7'
    implementation group: 'com.github.albfernandez', name: 'juniversalchardet', version: '2.5.2'
    implementation group: 'org.hibernate', name: 'hibernate-gradle-plugin', version: '5.6.15.Final'
    implementation group: 'com.google.zxing', name: 'core', version: '3.5.4'
    implementation group: 'com.google.zxing', name: 'javase', version: '3.5.4'
    implementation group: 'commons-io', name: 'commons-io', version: '2.22.0'
    implementation group: 'org.apache.commons', name: 'commons-lang3', version: '3.22.0'
    implementation group: 'org.apache.commons', name: 'commons-text', version: '1.15.0'
    implementation group: 'com.memetix', name: 'microsoft-translator-java-api', version: '0.6.2'
    implementation group: 'org.openoffice', name: 'jurt', version: '4.1.2'
    implementation group: 'org.openoffice', name: 'juh', version: '4.1.2'
    implementation group: 'org.apache.xmlgraphics', name: 'fop', version: '2.12'
    implementation group: 'org.quelea', name: 'planning-center', version: '0.3.1'

    implementation group: 'org.openoffice', name: 'unoil', version: '4.1.2'
    implementation group: 'org.openoffice', name: 'bootstrap-connector', version: '0.1.1'

    implementation group: 'com.aparapi', name: 'aparapi', version: '3.0.2'

    implementation group: 'org.jflac', name: 'jflac-codec', version: '1.5.2'
    implementation group: 'org.jcraft', name: 'jorbis', version: '0.0.17'

    implementation group: 'jakarta.xml.bind', name: 'jakarta.xml.bind-api', version: '4.0.5'
    implementation group: 'com.sun.xml.bind', name: 'jaxb-core', version: '4.0.9'
    implementation group: 'com.sun.xml.bind', name: 'jaxb-impl', version: '4.0.9'
    implementation group: 'com.sun.activation', name: 'javax.activation', version: '1.2.0'

    implementation group: 'com.dlsc.preferencesfx', name: 'preferencesfx-core', version: '11.19.0'

    implementation group: 'org.slf4j', name: 'slf4j-jdk14', version: '2.0.20'

    runtimeOnly "org.openjfx:javafx-graphics:$javafx.version:win"
    runtimeOnly "org.openjfx:javafx-graphics:$javafx.version:linux"
    runtimeOnly "org.openjfx:javafx-graphics:$javafx.version:mac"
    runtimeOnly "org.openjfx:javafx-media:$javafx.version:win"
    runtimeOnly "org.openjfx:javafx-media:$javafx.version:linux"
    runtimeOnly "org.openjfx:javafx-media:$javafx.version:mac"
    runtimeOnly "org.openjfx:javafx-web:$javafx.version:win"
    runtimeOnly "org.openjfx:javafx-web:$javafx.version:linux"
    runtimeOnly "org.openjfx:javafx-web:$javafx.version:mac"

    testImplementation group: 'org.junit.jupiter', name: 'junit-jupiter-api', version: '6.1.3'
    testImplementation group: 'org.junit.jupiter', name: 'junit-jupiter-engine', version: '6.1.3'
    testRuntimeOnly group: 'org.junit.platform', name: 'junit-platform-launcher', version: '6.1.3'
}

test {
    useJUnitPlatform()
    failOnNoDiscoveredTests = false
    // Same JVM options as the application, so video code under test behaves as it does at runtime.
    jvmArgs application.applicationDefaultJvmArgs
    // Schedule drop tests use JavaFX's in-memory dragboard instead of the system clipboard.
    jvmArgs '--add-exports=javafx.graphics/com.sun.javafx.scene.input=ALL-UNNAMED',
            '--add-exports=javafx.graphics/com.sun.javafx.tk=ALL-UNNAMED'
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat 'full'
    }
}

jar {
    manifest {
        attributes (
                'Main-Class': 'org.quelea.windows.main.MainStub',
                "Class-Path": configurations.runtimeClasspath.collect { "lib/" + it.getName() }.join(' ')
        )
    }
}

tasks.register('tar', Tar) {
    archiveFileName = JavaAppName
    destinationDirectory = file("${project.distdir}/standalone/")
    compression = Compression.GZIP

    into "Quelea-${versionsuffix}-java-app"
    from(project.distdir) {
        include "lib/",
            "bibles/",
            "dictionaries/",
            "icons/",
            "img/",
            "languages/",
            "licenses/",
            "server/",
            "themes/",
            "vid/",
            "fopcfg.xml",
            "quelea.properties",
            "scheduleformat.xsl",
            "songformat.xsl",
            "Quelea.jar"
    }
    // The installer also merges these jars into lib.  The tarball must do so
    // too, because the jar manifest refers to lib/<javafx-jar>.
    from("${project.distdir}/libjfx") {
        into 'lib'
    }
}

tasks.register('releaseSummary', JavaExec) {
    mainClass = 'org.quelea.services.utils.ReleaseSummaryGenerator'
    classpath = sourceSets.main.runtimeClasspath
}

tasks.named("izPackCreateInstaller") {
    dependsOn(tasks.named("zipMacPackr"))
    dependsOn(tasks.named('tar'))
}
