/*
 * Compatibility adaptation of gradle-launch4j's plugin setup.
 * Copyright (c) 2025 Sebastian Boegl
 * Licensed under the Apache License, Version 2.0:
 * https://www.apache.org/licenses/LICENSE-2.0
 * Remove this when upstream stops calling Configuration.setVisible.
 * Executable and XML generation remain upstream's.
 */
class QueleaLaunch4jPlugin implements Plugin<Project> {
    private final FileOperations fileOperations

    @Inject
    QueleaLaunch4jPlugin(FileOperations fileOperations) {
        this.fileOperations = fileOperations
    }

    void apply(Project project) {
        project.extensions.create('launch4j', Launch4jPluginExtension, project,
                fileOperations, project.objects, project.providers)
        def binaries = project.configurations.create('launch4jBin') {
            transitive = false
            canBeConsumed = false
            canBeResolved = true
            description = 'The launch4j binary configuration for this project.'
            defaultDependencies {
                it.add(project.dependencies.create("net.sf.launch4j:launch4j:${Launch4jPlugin.ARTIFACT_VERSION}:${Launch4jPlugin.workdir()}"))
            }
            resolutionStrategy.dependencySubstitution {
                all { dependency ->
                    if (dependency.requested instanceof ModuleComponentSelector &&
                            dependency.requested.group == 'net.sf.launch4j' && dependency.requested.module == 'launch4j') {
                        dependency.useTarget "net.sf.launch4j:launch4j:${dependency.requested.version}:${Launch4jPlugin.workdir()}"
                    }
                }
            }
        }
        project.tasks.register('createExe', Launch4jLibraryTask) {
            group = 'launch4j'
            description = 'Runs the launch4j jar to generate an .exe file'
        }
        project.tasks.register('createAllExecutables') {
            group = 'launch4j'
            description = 'Runs all tasks that implement DefaultLaunch4jTask'
            dependsOn project.tasks.withType(DefaultLaunch4jTask)
        }
        project.tasks.withType(DefaultLaunch4jTask).configureEach {
            launch4jBinaryFiles.from(binaries)
        }
    }
}
