test {
    useJUnitPlatform()
    failOnNoDiscoveredTests = false
    // JavaFX can be on the test classpath when the JDK does not bundle its modules.
    jvmArgs application.applicationDefaultJvmArgs.findAll { it != nativeAccessJvmArg }
    if (ModuleFinder.ofSystem().find('javafx.graphics').isPresent()) {
        jvmArgs nativeAccessJvmArg
    }
    // Schedule drop tests use JavaFX's in-memory dragboard instead of the system clipboard.
    jvmArgs '--add-exports=javafx.graphics/com.sun.javafx.scene.input=ALL-UNNAMED',
            '--add-exports=javafx.graphics/com.sun.javafx.tk=ALL-UNNAMED'
    // Opt-in tests that drive real applications, e.g. -Dquelea.test.powerpoint=true
    systemProperties System.properties.findAll { it.key.toString().startsWith('quelea.test.') }
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat = 'full'
    }
}

jar {
