name: Build CI release

on:
  push:
    branches:
      - master
    # paths:
    #   - 'Quelea/**'

  pull_request:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select signing policy
        if: ${{ github.event_name == 'push' }}
        id: signing-policy
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import re

          source = pathlib.Path('Quelea/src/main/java/org/quelea/services/utils/QueleaProperties.java')
          declarations = re.findall(
              r'(?m)^[ \t]*public\s+static\s+final\s+Version\s+VERSION\s*=\s*([^;]+);',
              source.read_text(encoding='utf-8'),
          )
          if len(declarations) != 1:
              raise SystemExit('Expected exactly one Quelea VERSION declaration')
          version = re.fullmatch(
              r'\s*new\s+Version\s*\(\s*"[^"]+"\s*,\s*VersionType\.(CI|BETA|RELEASE)\s*\)\s*',
              declarations[0],
          )
          if not version:
              raise SystemExit('Unrecognised Quelea VERSION declaration or version type')
          version_type = version.group(1)
          policy = 'test-signing' if version_type == 'CI' else 'release-signing'
          print(f'Version type {version_type} uses {policy}')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'slug={policy}\n')
          PY

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          java-package: 'jdk'
          distribution: 'temurin'
      
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
      
      - name: Install Wine and Flatpak
        run: |
          sudo dpkg --add-architecture i386
          sudo apt update
          sudo apt install wine wine32 wine64 flatpak flatpak-builder

      - name: Setup Inno Setup cache
        id: cache-innosetup
        uses: actions/cache@v4
        with:
          path: ~/.wine/drive_c/Program Files/Inno Setup 7
          key: ${{ runner.os }}-innosetup-7.1.1-x64

      - name: Install InnoSetup
        if: ${{ ! steps.cache-innosetup.outputs.cache-hit }} # || true on Inno Setup update
        env:
          DISPLAY: :99
          WINEDEBUG: -all,err+all
          WINEARCH: win64
        run: |
          Xvfb $DISPLAY &
          curl --fail --location --silent --show-error "https://github.com/jrsoftware/issrc/releases/download/is-7_1_1/innosetup-7.1.1-x64.exe" -o is.exe
          echo "8a5a6711c3766a6e5fb74f280ba0e3551e719ce94538d901fdbd1f8f9920b3f0  is.exe" | sha256sum --check
          wine is.exe /SP- /VERYSILENT /ALLUSERS /SUPPRESSMSGBOXES '/DIR=C:\Program Files\Inno Setup 7'
          test -s "$HOME/.wine/drive_c/Program Files/Inno Setup 7/ISCC.exe"

      - name: Build
        run: |
          cd Quelea
          ./gradlew -Dversionsuffix=CI-UNSTABLE clean dist

      - name: Cache Flatpak
        uses: actions/cache@v4
        with:
          path: |
            flatpak/repo
            flatpak/builddir
          key: flatpak

      - name: Build Flatpak
        run: |
          flatpak remote-add --if-not-exists --user flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          cd flatpak
          flatpak-builder --force-clean --user --install-deps-from=flathub --repo=repo builddir org.quelea.Quelea.yml
          flatpak build-bundle repo/ ../Quelea/dist/standalone/quelea-CI-UNSTABLE.flatpak org.quelea.Quelea --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo

      - name: upload-unsigned-artifact
        if: ${{ github.event_name == 'push' }}
        id: upload-unsigned-artifact
        uses: actions/upload-artifact@v4
        with: 
          path: Quelea/dist/standalone/quelea-CI-UNSTABLE-x64-windows-install.exe

      - name: Remove unsigned artifact
        if: ${{ github.event_name == 'push' }}
        run: |
          rm -f Quelea/dist/standalone/quelea-CI-UNSTABLE-x64-windows-install.exe
            
      - name: Sign windows installer
        if: ${{ github.event_name == 'push' }}
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '47d2e61b-2716-4b94-b15a-91240cb1d14c'
          project-slug: 'Quelea'
          signing-policy-slug: '${{ steps.signing-policy.outputs.slug }}'
          github-artifact-id: '${{ steps.upload-unsigned-artifact.outputs.artifact-id }}'
          wait-for-completion: true
          output-artifact-directory: 'Quelea/dist/standalone/'

      - name: Upload binaries to release
        if: ${{ github.event_name == 'push' }}
        uses: softprops/action-gh-release@v2
        with:
          files: Quelea/dist/standalone/*
          tag_name: CI-RELEASE
          prerelease: true
          make_latest: false
          body: "**This is a CI Build, built from the latest copy of the source code automatically. 
                It's not an official release and we don't recommend using this in production.**<br/>
                Quelea is also distributed as a Linux snap package. To install it, make 
                sure snap is installed then run:
                <pre>sudo snap install --edge quelea</pre>"

      - name: Upload standalones as artifact of PR
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          path: Quelea/dist/standalone/
